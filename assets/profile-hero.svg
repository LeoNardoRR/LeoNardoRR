<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Leonardo Ribeiro — systems in motion</title>
  <desc id="desc">Original animated banner with connected nodes representing APIs, automation, data, and delivery.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#07101f"/>
      <stop offset=".58" stop-color="#101a33"/>
      <stop offset="1" stop-color="#092b37"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop stop-color="#20bfa9"/>
      <stop offset=".55" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#9b7cf6"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#74a2bc" stroke-opacity=".11"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .trace{stroke-dasharray:9 12;animation:flow 7s linear infinite}
      .pulse{animation:pulse 3s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-210}}
      @keyframes pulse{50%{opacity:.35}}
      @media(prefers-reduced-motion:reduce){.trace,.pulse{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#background)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="1062" cy="77" r="155" fill="#20bfa9" opacity=".055"/>
  <circle cx="845" cy="337" r="180" fill="#9b7cf6" opacity=".065"/>
  <rect x="24" y="24" width="1152" height="312" rx="17" fill="none" stroke="#55b7c4" stroke-opacity=".22"/>
  <path d="M70 82h48m-48 0v48M1130 278v27h-48" fill="none" stroke="#20bfa9" stroke-width="3" opacity=".7"/>

  <text x="72" y="84" class="mono" font-size="15" letter-spacing="3" fill="#64d8d3">LEONARDO.RIBEIRO / PROFILE</text>
  <text x="70" y="171" class="sans" font-size="62" font-weight="800" letter-spacing="-2" fill="#f3f8ff">Systems in motion.</text>
  <rect x="72" y="190" width="492" height="4" rx="2" fill="url(#accent)"/>
  <text x="72" y="233" class="sans" font-size="23" fill="#c5d5e3">Integrations · Automation · APIs · Martech</text>
  <text x="72" y="288" class="mono" font-size="16" fill="#8fa7b9">from requirements → reliable delivery</text>

  <g fill="none" stroke="#27c6b4" stroke-width="2">
    <path d="M690 190C740 190 736 94 810 94S900 150 938 150 1020 94 1084 94" opacity=".35"/>
    <path d="M690 190C750 190 750 267 830 267S909 220 959 220 1020 267 1084 267" opacity=".35"/>
    <path d="M690 190C760 190 765 185 839 185H1084" opacity=".35"/>
    <path class="trace" d="M690 190C740 190 736 94 810 94S900 150 938 150 1020 94 1084 94" stroke="url(#accent)"/>
    <path class="trace" d="M690 190C750 190 750 267 830 267S909 220 959 220 1020 267 1084 267" stroke="url(#accent)"/>
    <path class="trace" d="M690 190C760 190 765 185 839 185H1084" stroke="url(#accent)"/>
  </g>
  <circle cx="690" cy="190" r="23" fill="#0b2534" stroke="#20bfa9" stroke-width="3"/>
  <circle class="pulse" cx="690" cy="190" r="11" fill="#20bfa9" filter="url(#glow)"/>
  <g class="mono" font-size="13" letter-spacing="1" fill="#d5e5f1">
    <rect x="792" y="69" width="92" height="38" rx="9" fill="#142a3b" stroke="#428d99"/><text x="808" y="93">APIs</text>
    <rect x="917" y="130" width="137" height="38" rx="9" fill="#142a3b" stroke="#428d99"/><text x="932" y="154">AUTOMATION</text>
    <rect x="843" y="166" width="89" height="38" rx="9" fill="#142a3b" stroke="#428d99"/><text x="858" y="190">DATA</text>
    <rect x="953" y="246" width="129" height="38" rx="9" fill="#142a3b" stroke="#428d99"/><text x="968" y="270">DELIVERY</text>
  </g>
</svg>
