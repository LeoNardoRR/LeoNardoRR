<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img">
  <title>Animated systems integration flow</title>
  <desc>Data particles flow from a CRM through APIs and automation into a connected application.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1b2e"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="flowGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>

    <radialGradient id="nodeGlow">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <path id="route1" d="M210 150 C280 150 300 150 370 150"/>
    <path id="route2" d="M490 150 C560 150 580 150 650 150"/>
    <path id="route3" d="M770 150 C840 150 860 150 930 150"/>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#background)"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="26.5" fill="none" stroke="#334155" stroke-width="3"/>

  <g opacity="0.15">
    <path d="M0 54H1200M0 102H1200M0 198H1200M0 246H1200" stroke="#94a3b8"/>
    <path d="M72 0V300M168 0V300M1032 0V300M1128 0V300" stroke="#94a3b8"/>
  </g>

  <text x="60" y="48" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="17" letter-spacing="4">
    SYSTEMS IN MOTION
  </text>
  <circle cx="1110" cy="42" r="5" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="1125" y="48" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="15">LIVE</text>

  <g fill="none" stroke="url(#flowGradient)" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <use href="#route1" stroke-dasharray="10 14">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.8s" repeatCount="indefinite"/>
    </use>
    <use href="#route2" stroke-dasharray="10 14">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </use>
    <use href="#route3" stroke-dasharray="10 14">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </use>
  </g>

  <g filter="url(#glow)">
    <circle r="6" fill="#22d3ee">
      <animateMotion dur="2.3s" repeatCount="indefinite">
        <mpath href="#route1"/>
      </animateMotion>
    </circle>
    <circle r="6" fill="#8b5cf6">
      <animateMotion dur="2.3s" begin="0.55s" repeatCount="indefinite">
        <mpath href="#route2"/>
      </animateMotion>
    </circle>
    <circle r="6" fill="#f43f5e">
      <animateMotion dur="2.3s" begin="1.1s" repeatCount="indefinite">
        <mpath href="#route3"/>
      </animateMotion>
    </circle>
  </g>

  <g filter="url(#softShadow)">
    <g transform="translate(150 150)">
      <circle r="72" fill="url(#nodeGlow)"/>
      <circle r="54" fill="#0f2942" stroke="#22d3ee" stroke-width="3"/>
      <circle r="60" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0">
        <animate attributeName="r" values="56;72;56" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0;0.55" dur="3s" repeatCount="indefinite"/>
      </circle>
      <rect x="-21" y="-22" width="42" height="44" rx="8" fill="none" stroke="#e2e8f0" stroke-width="3"/>
      <path d="M-12-10H12M-12 0H12M-12 10H5" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="92" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">CRM</text>
    </g>

    <g transform="translate(430 150)">
      <circle r="72" fill="url(#nodeGlow)"/>
      <circle r="54" fill="#1d2144" stroke="#8b5cf6" stroke-width="3"/>
      <circle r="60" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0">
        <animate attributeName="r" values="56;72;56" dur="3s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0;0.55" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <path d="M-22-12L-8-26M8-26L22-12M22 12L8 26M-8 26L-22 12" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
      <circle r="12" fill="none" stroke="#8b5cf6" stroke-width="4"/>
      <text x="0" y="92" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">API</text>
    </g>

    <g transform="translate(710 150)">
      <circle r="72" fill="url(#nodeGlow)"/>
      <circle r="54" fill="#2b193c" stroke="#c084fc" stroke-width="3"/>
      <circle r="60" fill="none" stroke="#c084fc" stroke-width="2" opacity="0">
        <animate attributeName="r" values="56;72;56" dur="3s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0;0.55" dur="3s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <path d="M-25 0H-12L-4-17L7 18L15 0H25" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-25" cy="0" r="5" fill="#c084fc"/>
      <circle cx="25" cy="0" r="5" fill="#c084fc"/>
      <text x="0" y="92" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">AUTOMATION</text>
    </g>

    <g transform="translate(990 150)">
      <circle r="72" fill="url(#nodeGlow)"/>
      <circle r="54" fill="#3a1628" stroke="#f43f5e" stroke-width="3"/>
      <circle r="60" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0">
        <animate attributeName="r" values="56;72;56" dur="3s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0;0.55" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <rect x="-27" y="-19" width="54" height="38" rx="5" fill="none" stroke="#f8fafc" stroke-width="4"/>
      <path d="M-13 29H13M0 19V29" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
      <text x="0" y="92" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">APPLICATION</text>
    </g>
  </g>

  <g transform="translate(60 274)">
    <rect width="1080" height="4" rx="2" fill="#1e293b"/>
    <rect width="260" height="4" rx="2" fill="url(#flowGradient)">
      <animate attributeName="x" values="-260;1080" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
