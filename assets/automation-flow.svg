<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Minimal software delivery flow</title>
  <desc id="desc">A minimal, accessible illustration of a four-step delivery pipeline.</desc>
  <style><![CDATA[
    :root{--bg:#0b1222;--muted:#94a3b8;--accent:#22d3ee}
    svg{display:block;background:var(--bg);border-radius:12px}
    .line{stroke:var(--muted);stroke-width:1.2;stroke-linecap:round}
    .node{fill:none;stroke:var(--muted);stroke-width:1.2}
    .dot{fill:var(--accent)}
    .label{fill:var(--muted);font-family:Inter, Arial, sans-serif;font-size:12px}
    /* Respect users who prefer reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .move { display: none !important; }
    }
  ]]></style>

  <!-- guideline line and nodes -->
  <g transform="translate(60,80)">
    <path id="route" d="M0 40 H1080" class="line" fill="none"/>

    <!-- four minimal nodes -->
    <g transform="translate(0,0)">
      <circle class="node" cx="0" cy="40" r="6"/>
      <text class="label" x="0" y="62" text-anchor="middle">analyze()</text>
    </g>

    <g transform="translate(360,0)">
      <circle class="node" cx="0" cy="40" r="6"/>
      <text class="label" x="0" y="62" text-anchor="middle">architect()</text>
    </g>

    <g transform="translate(720,0)">
      <circle class="node" cx="0" cy="40" r="6"/>
      <text class="label" x="0" y="62" text-anchor="middle">verify()</text>
    </g>

    <g transform="translate(1080,0)">
      <circle class="node" cx="0" cy="40" r="6"/>
      <text class="label" x="0" y="62" text-anchor="middle">deliver()</text>
    </g>

    <!-- subtle moving dot to suggest flow; hidden for reduced-motion -->
    <g class="move" aria-hidden="true">
      <circle class="dot" r="4">
        <animateMotion dur="3s" repeatCount="indefinite">
          <mpath href="#route" />
        </animateMotion>
      </circle>
    </g>
  </g>
</svg>
